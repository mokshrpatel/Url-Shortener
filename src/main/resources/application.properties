spring.application.name=urlshortener

spring.datasource.master.jdbcUrl=jdbc:postgresql://localhost:5432/urlshortener
spring.datasource.master.username=moksh
spring.datasource.master.password=2005
spring.datasource.master.driver-class-name=org.postgresql.Driver

spring.datasource.slave.jdbcUrl=jdbc:postgresql://localhost:5432/urlshortener
spring.datasource.slave.username=moksh
spring.datasource.slave.password=2005
spring.datasource.slave.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# OAuth2 Google Provider Configuration
spring.security.oauth2.client.registration.google.client-id=YOUR_CLIENT_ID
spring.security.oauth2.client.registration.google.client-secret=YOUR_CLIENT_SECRET
spring.security.oauth2.client.registration.google.scope=profile, email

# Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Kafka Configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=url-analytics-group
spring.kafka.consumer.auto-offset-reset=earliest